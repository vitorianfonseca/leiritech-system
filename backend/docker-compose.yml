services:
  db:
    image: postgres:16
    container_name: leiritech-postgres
    environment:
      POSTGRES_USER: leiritech
      POSTGRES_PASSWORD: leiritech
      POSTGRES_DB: leiritech
    ports:
      # 5433 is taken by another project's Postgres on this machine, and the
      # two cannot share it. 5434 keeps both running side by side.
      - "5434:5432"
    volumes:
      - leiritech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leiritech -d leiritech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leiritech_pgdata:
