services:
  db:
    image: postgres:16
    container_name: aurea-postgres
    environment:
      POSTGRES_USER: aurea
      POSTGRES_PASSWORD: aurea
      POSTGRES_DB: aurea
    ports:
      - "5433:5432"
    volumes:
      - aurea_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurea -d aurea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aurea_pgdata:
