# Render blueprint — the FastAPI backend and its PostgreSQL database.
#
# The frontend is not here: it goes to Vercel, which is where a Next.js app
# belongs. This file covers the half Vercel cannot host.
#
# To use it: Render dashboard -> New -> Blueprint -> pick this repo. Render
# reads this file, creates both resources, and wires DATABASE_URL between
# them. Everything marked `sync: false` has to be filled in by hand once the
# URLs exist — see the note on each.

databases:
  - name: leiritech-db
    databaseName: leiritech
    user: leiritech
    plan: free

services:
  - type: web
    name: leiritech-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health

    # Migrations run at start, not as a pre-deploy step: Render's
    # `preDeployCommand` needs a paid instance type. This is safe while the
    # service runs as a single instance — `alembic upgrade head` is a no-op
    # once the schema is current. If this ever scales past one instance, move
    # it to a pre-deploy hook so two containers cannot migrate at once.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # The app refuses to start in production on the dev default, which is
      # the point — see validate_production_settings in app/core/config.py.
      - key: DATABASE_URL
        fromDatabase:
          name: leiritech-db
          property: connectionString

      # Generated by Render, never in the repo. Must be >= 32 chars or the
      # app fails fast at startup.
      - key: JWT_SECRET
        generateValue: true

      # Render terminates TLS in front of the app, so X-Forwarded-For carries
      # exactly one proxy entry. At 0 every user shares one rate-limit bucket
      # and a single attacker locks everyone out; higher than the real proxy
      # count and a client can forge a fresh bucket per request.
      - key: TRUSTED_PROXY_COUNT
        value: "1"

      # Set once the Vercel deployment exists — this is the CORS allowlist,
      # so the frontend cannot call the API until it is right.
      - key: FRONTEND_URL
        sync: false

      # This service's own public URL, e.g. https://leiritech-api.onrender.com
      - key: BACKEND_URL
        sync: false

      # Optional. Attachments return 503 STORAGE_NOT_CONFIGURED until the R2
      # set is filled in; invitations and password resets need Resend. Both
      # are inert rather than broken while empty.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

# The 12 automations in app/automations/run.py are NOT scheduled here.
# Render cron jobs need a paid plan, so on free they have to be triggered
# from outside — a GitHub Actions schedule calling `python -m
# app.automations.run all`, or any external cron. Until then: no overdue
# payment notices, no stale opportunity nudges, no health recomputation.
